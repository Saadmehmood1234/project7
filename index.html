<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgb(229, 240, 240);
        width: 100%;
        height: 100vh;
        gap: 20px;
      }
      .right {
        display: flex;
        background-color: rgb(238, 181, 181);
        justify-content: center;
        align-items: center;
        border: 2px solid;
        width: 300px;
        height: 600px;
        flex-direction: column;
        border-radius: 10px;
        gap: 10px;
      }
      .left {
        display: flex;
        background-color: rgb(226, 241, 202);
        justify-content: center;
        align-items: center;
        border: 2px solid;
        width: 300px;
        height: 600px;
        flex-direction: column;
        border-radius: 10px;
        gap: 10px;
      }
      .elem {
        display: flex;
        justify-content: center;
        align-items: center;
        border: 1px dotted;
        background-color: rgb(187, 187, 233);
        width: 200px;
        height: 100px;
        border-radius: 5px;
        color: rgb(69, 131, 131);
      }
    </style>
  </head>
  <body>
    <div class="left" id="left">
      <div class="elem" draggable="true">Tahir</div>
      <div class="elem" draggable="true">Sachin</div>
      <div class="elem" draggable="true">Kamlesh</div>
      <div class="elem" draggable="true">Aquib</div>
      <div class="elem" draggable="true">Rahul</div>
    </div>
    <div class="right" id="right"></div>
  </body>
  <script>
    let elements = document.getElementsByClassName("elem");
    let leftBox = document.getElementById("left");
    let rightBox = document.getElementById("right");
    for (let el of elements) {
      el.addEventListener("dragstart", function (e) {
        let selected = e.target;
        rightBox.addEventListener("dragover", function (e) {
          e.preventDefault();
        });
        rightBox.addEventListener("drop",function(e){
            rightBox.appendChild(selected);
            selected=null;
        })
        leftBox.addEventListener("dragover",function(e){
            e.preventDefault()
        })
        leftBox.addEventListener("drop",function(e){
            leftBox.appendChild(selected);
            selected=null
        })
      });
    }
  </script>
</html>
